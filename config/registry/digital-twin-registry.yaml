# ==============================================================================
# DOMAIN: LIGHTS
# ==============================================================================
lights:
  living:
    power:
      id: lights.living.power
      description: >
        Comanda la lampada principale del soggiorno.
      domain: lights
      entity_id: living
      property: power
      status: legacy
      source_type: physical_actuator
      location:
        id: living
        label: "Soggiorno"
      display:
        name: "Lampada Living"
        icon: "lightbulb"
      group: living_room
      state_update:
        mode: retained
      behavior:
        optimistic_update: false
        requires_confirmation: true
      capabilities:
        readable: true
        writable: true
        historized: true
      interface:
        state_topic: zara/interface/lights/living/power/stat
        command_topic: zara/interface/lights/living/power/cmd
        ack_topic: zara/interface/lights/living/power/stat
        schema:
          type: boolean
      mqtt:
        qos: 1
        retain_state: true
        retain_command: false
      transform:
        command:
          true: "on"
          false: "off"
        state:
          "on": true
          "off": false
      legacy:
        device_id: shelly_livinglamp
        source:
          broker: home
          topic: zara/domotics/lights/livinglamp
