        optimistic_update: false
        requires_confirmation: true
      capabilities:
        readable: true
        writable: true
        historized: true
      interface:
        state_topic: zara/interface/lights/hifi/power/stat
        command_topic: zara/interface/lights/hifi/power/cmd
